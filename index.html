<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履修計画シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="p-3 md:p-6 lg:p-8">

    <div class="max-w-7xl mx-auto space-y-6">

        <!-- ヘッダー -->
        <header
            class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold mb-2">
                    <span>🎓 履修・学習シミュレーター</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800 tracking-tight">履修計画シミュレーター</h1>
                <p class="text-sm text-slate-500 mt-1">レポート締切（各＋5コマ）に合わせて、曜日別ペースで計画を最適化できます。</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- 左側：設定パネル (4列) -->
            <div
                class="lg:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <div>
                    <h2
                        class="text-lg font-bold text-slate-800 mb-4 pb-3 border-b border-slate-100 flex items-center justify-between">
                        <span>⚙️ 条件設定</span>
                        <button type="button" onclick="resetDefaults()"
                            class="text-xs font-medium text-blue-600 hover:underline">初期値に戻す</button>
                    </h2>

                    <form id="simulatorForm" class="space-y-5">
                        <!-- 授業数 -->
                        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                            <label class="block text-xs font-bold text-slate-700 mb-1">履修する授業数</label>
                            <div class="flex items-center gap-3">
                                <input type="number" id="courseCount" min="1" max="15" value="4"
                                    class="w-24 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 p-2 text-center font-bold text-slate-800 text-base">
                                <div class="text-xs text-slate-500 leading-tight">
                                    全 <span id="totalClassesCount" class="font-bold text-blue-600">60</span>
                                    コマ（全15回/授業）<br>
                                    締切毎に各授業 <span class="font-semibold text-slate-700">+5コマ</span> 必要
                                </div>
                            </div>
                        </div>

                        <!-- 日程設定 -->
                        <div class="space-y-2.5">
                            <label class="block text-xs font-bold text-slate-700">📅 スケジュール設定</label>

                            <div class="grid grid-cols-1 gap-2 text-xs">
                                <div
                                    class="flex items-center justify-between bg-slate-50 p-2 rounded-lg border border-slate-200">
                                    <span class="font-semibold text-slate-600 pl-1">開始日</span>
                                    <input type="date" id="startDate" required
                                        class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 font-medium focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div
                                    class="flex items-center justify-between bg-red-50/50 p-2 rounded-lg border border-red-100">
                                    <span class="font-semibold text-red-700 pl-1">締切 1</span>
                                    <input type="date" id="dl1" required
                                        class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 font-medium focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div
                                    class="flex items-center justify-between bg-orange-50/50 p-2 rounded-lg border border-orange-100">
                                    <span class="font-semibold text-orange-700 pl-1">締切 2</span>
                                    <input type="date" id="dl2" required
                                        class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 font-medium focus:ring-2 focus:ring-blue-500">
                                </div>
                                <div
                                    class="flex items-center justify-between bg-pink-50/50 p-2 rounded-lg border border-pink-100">
                                    <span class="font-semibold text-pink-700 pl-1">締切 3</span>
                                    <input type="date" id="dl3" required
                                        class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 font-medium focus:ring-2 focus:ring-blue-500">
                                </div>
                            </div>
                        </div>

                        <!-- 曜日別学習ペース -->
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <label class="block text-xs font-bold text-slate-700">⏱️ 1日のコマ数（日〜土）</label>
                            </div>

                            <!-- プリセットボタン -->
                            <div class="flex gap-1.5 mb-2.5">
                                <button type="button" onclick="setPreset([0,2,2,2,2,2,4])"
                                    class="flex-1 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">標準</button>
                                <button type="button" onclick="setPreset([0,0,0,0,0,6,6])"
                                    class="flex-1 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">土日</button>
                                <button type="button" onclick="setPreset([0,3,3,3,3,3,0])"
                                    class="flex-1 py-1 text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition">平日</button>
                            </div>

                            <!-- 7曜日を入力しやすい1行横並びレイアウトに固定（幅狭でも潰れないよう最適化） -->
                            <div class="grid grid-cols-7 gap-1">
                                <div class="bg-red-50 py-1.5 px-0.5 rounded-lg border border-red-100 text-center">
                                    <span class="block text-[11px] font-bold text-red-600 mb-0.5 select-none">日</span>
                                    <input type="number" id="cap0" min="0" value="0" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div class="bg-slate-50 py-1.5 px-0.5 rounded-lg border border-slate-200 text-center">
                                    <span class="block text-[11px] font-bold text-slate-600 mb-0.5 select-none">月</span>
                                    <input type="number" id="cap1" min="0" value="2" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div class="bg-slate-50 py-1.5 px-0.5 rounded-lg border border-slate-200 text-center">
                                    <span class="block text-[11px] font-bold text-slate-600 mb-0.5 select-none">火</span>
                                    <input type="number" id="cap2" min="0" value="2" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div class="bg-slate-50 py-1.5 px-0.5 rounded-lg border border-slate-200 text-center">
                                    <span class="block text-[11px] font-bold text-slate-600 mb-0.5 select-none">水</span>
                                    <input type="number" id="cap3" min="0" value="2" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div class="bg-slate-50 py-1.5 px-0.5 rounded-lg border border-slate-200 text-center">
                                    <span class="block text-[11px] font-bold text-slate-600 mb-0.5 select-none">木</span>
                                    <input type="number" id="cap4" min="0" value="2" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div class="bg-slate-50 py-1.5 px-0.5 rounded-lg border border-slate-200 text-center">
                                    <span class="block text-[11px] font-bold text-slate-600 mb-0.5 select-none">金</span>
                                    <input type="number" id="cap5" min="0" value="2" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                                <div class="bg-blue-50 py-1.5 px-0.5 rounded-lg border border-blue-100 text-center">
                                    <span class="block text-[11px] font-bold text-blue-600 mb-0.5 select-none">土</span>
                                    <input type="number" id="cap6" min="0" value="4" inputmode="numeric"
                                        class="w-full bg-white border border-slate-300 rounded py-1 px-0 text-center font-bold text-xs sm:text-sm focus:ring-1 focus:ring-blue-500 focus:outline-none">
                                </div>
                            </div>
                        </div>

                        <button type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md shadow-blue-500/20 flex items-center justify-center gap-2">
                            <span>⚡ シミュレーションを実行</span>
                        </button>
                    </form>
                </div>

                <!-- 凡例 -->
                <div id="courseLegend" class="mt-6 pt-4 border-t border-slate-100 hidden">
                    <span class="block text-xs font-bold text-slate-500 mb-2">授業凡例</span>
                    <div id="legendContainer" class="flex flex-wrap gap-1.5"></div>
                </div>
            </div>

            <!-- 右側：結果表示 & カレンダー (8列) -->
            <div class="lg:col-span-8 space-y-4">

                <!-- メッセージ & サマリーエリア -->
                <div id="summaryCards" class="grid grid-cols-1 md:grid-cols-3 gap-3 hidden">
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg text-xl font-bold">📚</div>
                        <div>
                            <div class="text-xs text-slate-500 font-medium">総コマ数</div>
                            <div id="statTotal" class="text-lg font-extrabold text-slate-800">60 コマ</div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg text-xl font-bold">🗓️</div>
                        <div>
                            <div class="text-xs text-slate-500 font-medium">1週間あたり</div>
                            <div id="statWeekly" class="text-lg font-extrabold text-slate-800">14 コマ</div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-3">
                        <div id="statStatusIcon" class="p-3 bg-indigo-50 text-indigo-600 rounded-lg text-xl font-bold">✨
                        </div>
                        <div>
                            <div class="text-xs text-slate-500 font-medium">判定結果</div>
                            <div id="statStatusText" class="text-base font-extrabold text-slate-800">達成可能</div>
                        </div>
                    </div>
                </div>

                <div id="resultMessage"
                    class="hidden p-4 rounded-xl shadow-sm border text-sm font-medium transition-all"></div>

                <!-- カレンダー本体 -->
                <div id="calendarContainer" class="space-y-6">
                    <div class="bg-white p-12 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-400">
                        <div class="text-4xl mb-3">📅</div>
                        <p class="font-bold text-slate-600 text-base">まだシミュレーションが実行されていません</p>
                        <p class="text-xs text-slate-400 mt-1">条件を設定して「シミュレーションを実行」ボタンを押してください。</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="system.js"></script>
</body>

</html>
